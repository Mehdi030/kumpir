name: Post Vercel Preview Link to Discord

on:
  push:
    branches:
      - web

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Vercel preview deployment URL for this commit (wait until READY)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e

          for i in {1..60}; do
            echo "Attempt $i/60: checking Vercel deployments for commit $GIT_SHA..."

            response=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=50")

            url=$(echo "$response" | jq -r --arg sha "$GIT_SHA" '
              .deployments
              | map(select(
                  .state=="READY"
                  and (.target=="preview" or .target==null)
                  and (.meta.githubCommitRef=="web")
                  and (.meta.githubCommitSha==$sha)
                ))
              | .[0].url
            ')

            if [ -n "$url" ] && [ "$url" != "null" ]; then
              echo "Found READY preview deployment for this commit: $url"
              echo "preview_url=https://$url" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Not READY yet for this commit. Sleeping 10s..."
            sleep 10
          done

          echo "❌ Timeout: No READY preview deployment found for this commit."
          exit 1

      - name: Send or update preview message on Discord
        env:
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          DISCORD_PREVIEW_MESSAGE_ID: ${{ secrets.DISCORD_PREVIEW_MESSAGE_ID }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -e

          payload=$(cat <<JSON
          {
            "content": "🔗 **AKTUELLE PREVIEW (Vercel)**\n\n${PREVIEW_URL}\n\n**Commit:** \`${COMMIT_SHA:0:7}\`\n**Von:** ${AUTHOR}\n**Msg:** ${COMMIT_MSG}\n\nFür Tests & Feedback nutzen.\nHinweis:\n• Preview pro Commit\n• Kann instabil sein"
          }
          JSON
          )

          if [ -n "$DISCORD_PREVIEW_MESSAGE_ID" ]; then
            echo "Updating existing Discord message: $DISCORD_PREVIEW_MESSAGE_ID"
            curl -sS -X PATCH \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://discord.com/api/webhooks/$DISCORD_WEBHOOK_ID/$DISCORD_WEBHOOK_TOKEN/messages/$DISCORD_PREVIEW_MESSAGE_ID"
            echo "Done."
          else
            echo "No message id set. Creating new message..."
            res=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://discord.com/api/webhooks/$DISCORD_WEBHOOK_ID/$DISCORD_WEBHOOK_TOKEN?wait=true")

            msg_id=$(echo "$res" | jq -r '.id')
            echo "Created message id: $msg_id"
            echo "➡️ Set this as GitHub Secret DISCORD_PREVIEW_MESSAGE_ID"
          fi
