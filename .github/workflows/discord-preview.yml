name: Post Vercel Preview Link to Discord

on:
  push:
    branches:
      - web

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # jq wird für die Vercel-API-Auswertung benötigt
      - name: Ensure jq is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 1) Vercel Preview-URL für DIESEN Commit holen (wartet bis READY)
      - name: Get Vercel preview deployment URL (wait until READY)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e

          for i in {1..30}; do
            echo "Attempt $i/30: checking Vercel deployments..."

            response=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=50")

            url=$(echo "$response" | jq -r --arg sha "$GIT_SHA" '
              .deployments
              | map(select(
                  .state == "READY"
                  and (.target == "preview" or .target == null)
                  and .meta.githubCommitSha == $sha
                ))
              | .[0].url
            ')

            if [ -n "$url" ] && [ "$url" != "null" ]; then
              echo "Found READY preview: $url"
              echo "preview_url=https://$url" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Not ready yet. Sleeping 10s..."
            sleep 10
          done

          echo "❌ Timeout: No READY preview found for this commit."
          exit 1

      # 2) Discord-Nachricht posten (immer neu)
      - name: Post preview message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -e

          payload=$(cat <<JSON
          {
            "content": "🔗 **AKTUELLE SPIEL-VORSCHAU (KUMPIR)**\n\n👉 ${PREVIEW_URL}\n\nDas ist die **neueste Testversion** des Spiels.\nEinfach öffnen, ausprobieren und schauen, was neu ist.\n\n🧩 **Was wurde geändert?**\n• Update von ${AUTHOR}\n• Kurzinfo: ${COMMIT_MSG}\n\n⚠️ **Wichtig**\n• Das ist eine Testversion\n• Es können Fehler auftreten\n• Fortschritt oder Inhalte können sich ändern"
          }
          JSON
          )

          res=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL?wait=true")

          echo "$res"