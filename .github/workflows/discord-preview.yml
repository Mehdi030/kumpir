name: Post Vercel Preview Link to Discord

on:
  push:
    branches:
      - web

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure jq is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get Vercel preview deployment URL for this commit (wait until READY)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e

          for i in {1..30}; do
            echo "Attempt $i/30: checking Vercel deployments for commit $GIT_SHA..."

            response=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=50")

            url=$(echo "$response" | jq -r --arg sha "$GIT_SHA" '
              .deployments
              | map(select(
                  .state == "READY"
                  and (.target == "preview" or .target == null)
                  and .meta.githubCommitSha == $sha
                ))
              | .[0].url
            ')

            if [ -n "$url" ] && [ "$url" != "null" ]; then
              echo "Found READY preview: $url"
              echo "preview_url=https://$url" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Not ready yet. Sleeping 10s..."
            sleep 10
          done

          echo "❌ Timeout: No READY preview found for this commit."
          exit 1

      - name: Post preview message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -e

          payload=$(cat <<JSON
          {
            "content": "🔗 **AKTUELLE PREVIEW (Vercel)**\n\n${PREVIEW_URL}\n\n**Commit:** \`${COMMIT_SHA:0:7}\`\n**Von:** ${AUTHOR}\n**Msg:** ${COMMIT_MSG}\n\nFür Tests & Feedback nutzen.\nHinweis:\n• Preview pro Commit\n• Kann instabil sein"
          }
          JSON
          )

          res=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL?wait=true")

          echo "$res"