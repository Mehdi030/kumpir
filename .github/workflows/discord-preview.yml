name: Discord – neuester Deploy

# Bei jedem Push auf main: auf den fertigen Vercel-Deploy warten, im Discord-Preview-Kanal eine Karte
# mit Link, Änderung und Commit posten und die vorherige Karte löschen (im Kanal steht immer nur der
# neueste Stand). Die Karte richtet sich an Spieler (auch außerhalb des Teams); fehlgeschlagene Deploys werden nicht gepostet.
# Benötigte Secrets: VERCEL_TOKEN, VERCEL_PROJECT_ID, DISCORD_WEBHOOK_URL (Webhook des Preview-Kanals).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: discord-preview
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: https://kumpir-web.vercel.app

    steps:
      - name: Auf den Vercel-Deploy dieses Commits warten
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e
          for i in $(seq 1 60); do
            response=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=30")
            row=$(echo "$response" | jq -c --arg sha "$GIT_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0] // empty')
            state=$(echo "$row" | jq -r '.state // .readyState // empty')
            url=$(echo "$row" | jq -r '.url // empty')
            echo "Versuch $i: ${state:-noch nicht da}"
            if [ "$state" = "READY" ]; then
              echo "state=READY" >> "$GITHUB_OUTPUT"; echo "url=https://$url" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "state=$state" >> "$GITHUB_OUTPUT"; echo "url=https://$url" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 10
          done
          echo "state=TIMEOUT" >> "$GITHUB_OUTPUT"

      - name: Vorherige Nachricht merken (Cache)
        uses: actions/cache/restore@v4
        with:
          path: .discord-last-message
          key: discord-preview-msg-${{ github.run_id }}
          restore-keys: discord-preview-msg-

      - name: Letzte Änderungen holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Karte in Discord posten, alte löschen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE: ${{ steps.vercel.outputs.state }}
        run: |
          set -e
          # Fehlgeschlagene Deploys nicht posten: der Kanal ist für Spieler, die Live-Seite zeigt weiter den letzten guten Stand
          if [ "$STATE" != "READY" ]; then echo "Deploy-Status $STATE – keine Karte"; exit 0; fi

          # Die letzten 3 Änderungen, die Spieler merken (ohne CI/Doku/Technik), kurz und ohne Präfix wie "ui:" / "fix(home):"
          changes=$(git log -n 25 --format=%s \
            | grep -viE '^(ci|chore|docs|test|tests|refactor|build|style)(\(|:|!)' \
            | grep -viE 'discord|migration|skript|script' \
            | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?: *//' \
            | awk '!seen[$0]++' | head -n 3)
          # Kürzen in jq (zählt Zeichen, nicht Bytes – Umlaute bleiben heil)
          changes=$(jq -rn --arg ch "$changes" '$ch | split("\n") | map(select(length > 0) | (if length > 64 then .[0:62] + "…" else . end) | "• " + .) | join("\n")')

          payload=$(jq -n --arg ch "$changes" --arg live "$LIVE_URL" '{
            username: "Kumpir",
            avatar_url: ($live + "/icon-512.png"),
            embeds: [{
              author: { name: "Neue Version ist da!" },
              title: "🥔 Kumpir – die heiße Kartoffel mit Musik",
              description: (
                "Ein Song läuft, du hast die Kumpir: Titel erraten, weitergeben – "
                + "und bloß nicht erwischen lassen, wenn sie hochgeht! 💥\n"
                + "Kostenlos im Browser · kein Download · kein Konto nötig · 2–12 Spieler"
                + (if $ch == "" then "" else "\n\n**🆕 Neu dabei**\n" + $ch end)
                + "\n\n**▶️ Jetzt mitspielen:**\n" + $live
              ),
              color: 16750615,
              thumbnail: { url: ($live + "/icon-512.png") },
              timestamp: (now | todate)
            }]
          }')

          res=$(curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL?wait=true")
          new_id=$(echo "$res" | jq -r '.id // empty')
          if [ -z "$new_id" ]; then echo "Discord-Antwort: $res"; exit 1; fi

          # Alte Karte entfernen, damit im Kanal immer nur die neueste steht
          if [ -f .discord-last-message ]; then
            for old in $(cat .discord-last-message); do
              curl -sS -o /dev/null -w "alte Nachricht $old gelöscht: %{http_code}\n" -X DELETE "$DISCORD_WEBHOOK_URL/messages/$old" || true
            done
            : > .discord-last-message
          fi
          echo "$new_id" >> .discord-last-message

      - name: Nachricht für das nächste Mal merken
        uses: actions/cache/save@v4
        with:
          path: .discord-last-message
          key: discord-preview-msg-${{ github.run_id }}
