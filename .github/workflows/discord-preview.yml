name: Post Vercel Preview Link to Discord

on:
  push:
    branches:
      - web

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest Vercel preview deployment URL
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Hole die letzten Deployments und nimm das neueste, das READY ist und target=preview hat
          response=$(curl -sS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10")

          url=$(echo "$response" | jq -r '
            .deployments
            | map(select(.state=="READY" and .target=="preview"))
            | .[0].url
          ')

          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "❌ Konnte keine READY preview deployment URL finden."
            echo "$response" | jq -r '.deployments[0] // empty'
            exit 1
          fi

          echo "preview_url=https://$url" >> $GITHUB_OUTPUT

      - name: Send preview message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          payload=$(cat <<JSON
          {
            "content": "🔗 **AKTUELLE PREVIEW (Vercel)**\n\n${PREVIEW_URL}\n\n**Commit:** \`${COMMIT_SHA:0:7}\`\n**Von:** ${AUTHOR}\n**Msg:** ${COMMIT_MSG}\n\nFür Tests & Feedback nutzen.\nHinweis:\n• Preview pro Commit\n• Kann instabil sein"
          }
          JSON
          )

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
